		dialogBuffer.OnDialogEnd(function() {
			onExitDialog(null, dialogCallback);
		});
		bitsy.log("dialog start end");
		return;
	};

	isDialogMode = true;

	dialogRenderer.Reset();
	dialogRenderer.SetCentered(isNarrating /*centered*/);
	dialogBuffer.Reset();
	scriptInterpreter.SetDialogBuffer(dialogBuffer);

	var onScriptEnd = function(scriptResult) {
		dialogBuffer.OnDialogEnd(function() {
			onExitDialog(scriptResult, dialogCallback);
		});
	};

	if (scriptId === undefined) { // TODO : what's this for again?
		scriptInterpreter.Interpret(dialogStr, onScriptEnd);
	}
	else {
		if (!scriptInterpreter.HasScript(scriptId)) {
			scriptInterpreter.Compile(scriptId, dialogStr);
		}
		// scriptInterpreter.DebugVisualizeScript(scriptId);
		scriptInterpreter.Run(scriptId, onScriptEnd, objectContext);
	}

}

var isDialogPreview = false;
function startPreviewDialog(script, dialogCallback) {
	if (!scriptInterpreter || !dialogBuffer) {
		return;
	}

	isNarrating = true;

	isDialogMode = true;

	isDialogPreview = true;

	dialogRenderer.Reset();
	dialogRenderer.SetCentered(true);
	dialogBuffer.Reset();
	scriptInterpreter.SetDialogBuffer(dialogBuffer);

	// TODO : do I really need a seperate callback for this debug mode??
	onDialogPreviewEnd = dialogCallback;

	var onScriptEndCallback = function(scriptResult) {
		dialogBuffer.OnDialogEnd(function() {
			onExitDialog(scriptResult, null);
		});
	};

	scriptInterpreter.Eval(script, onScriptEndCallback);
}

/* NEW SCRIPT STUFF */
var scriptModule;
var scriptInterpreter;
var scriptUtils;
// scriptInterpreter.SetDialogBuffer( dialogBuffer );
if (engineFeatureFlags.isScriptEnabled) {
	bitsy.log("init script module");
	scriptModule = new Script();
	bitsy.log("init interpreter");
	scriptInterpreter = scriptModule.CreateInterpreter();
	bitsy.log("init utils");
	scriptUtils = scriptModule.CreateUtils(); // TODO: move to editor.js?
	bitsy.log("init script module end");
}

/* SOUND */
var soundPlayer;
if (engineFeatureFlags.isSoundEnabled) {
	soundPlayer = new SoundPlayer();
}

/* EVENTS */
bitsy.loop(update);
</script>

	</div>
</div>

<script>
(function () {
	var controls = document.getElementById('touch-controls');
	if (!controls) return;

	var activePointers = new Map();

	function positionControlsInBlackMargin() {
		var gameCanvas = document.getElementById('game');
		if (!gameCanvas) return;

		var canvasRect = gameCanvas.getBoundingClientRect();
		var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
		var blackMarginHeight = Math.max(0, viewportHeight - canvasRect.bottom);

		// Coloca el centro de la cruceta en el centro exacto del margen negro inferior.
		// Si no existe margen inferior (por ejemplo, en horizontal), usa el centro de pantalla.
		var centerY = blackMarginHeight > 0
			? canvasRect.bottom + (blackMarginHeight / 2)
			: viewportHeight / 2;

		controls.style.top = Math.round(centerY) + 'px';
	}

	requestAnimationFrame(positionControlsInBlackMargin);
	// El lienzo cambia de tamaño al arrancar el juego: se recoloca periódicamente.
	setInterval(positionControlsInBlackMargin, 250);
	window.addEventListener('load', positionControlsInBlackMargin);
	window.addEventListener('resize', positionControlsInBlackMargin);
	window.addEventListener('orientationchange', function () {
		setTimeout(positionControlsInBlackMargin, 100);
	});

	function createKeyboardEvent(type, keyCode, key, code) {
		var event = new KeyboardEvent(type, {
			key: key,
			code: code,
			bubbles: true,
			cancelable: true
		});

		// Bitsy consulta keyCode; se define explícitamente para navegadores modernos.
		try {
			Object.defineProperty(event, 'keyCode', { get: function () { return keyCode; } });
			Object.defineProperty(event, 'which', { get: function () { return keyCode; } });
		} catch (error) {
			// En navegadores antiguos, el constructor ya conserva keyCode/which.
		}
		return event;
	}

	function sendKey(type, button) {
		var keyCode = Number(button.dataset.keycode);
		document.dispatchEvent(createKeyboardEvent(type, keyCode, button.dataset.key, button.dataset.code));
	}

	function press(button, pointerId) {
		if (activePointers.has(pointerId)) return;
		activePointers.set(pointerId, button);
		button.classList.add('is-pressed');
		sendKey('keydown', button);
	}

	function release(pointerId) {
		var button = activePointers.get(pointerId);
		if (!button) return;
		sendKey('keyup', button);
		button.classList.remove('is-pressed');
		activePointers.delete(pointerId);
	}

	controls.querySelectorAll('button[data-keycode]').forEach(function (button) {
		button.addEventListener('pointerdown', function (event) {
			event.preventDefault();
			event.stopPropagation();
			button.setPointerCapture(event.pointerId);
			press(button, event.pointerId);
		});

		button.addEventListener('pointerup', function (event) {
			event.preventDefault();
			event.stopPropagation();
			release(event.pointerId);
		});

		button.addEventListener('pointercancel', function (event) {
			release(event.pointerId);
		});

		button.addEventListener('lostpointercapture', function (event) {
			release(event.pointerId);
		});

		button.addEventListener('contextmenu', function (event) {
			event.preventDefault();
		});
	});

	// Evita que la capa táctil de Bitsy interprete los botones como gestos o toques.
	['touchstart', 'touchmove', 'touchend'].forEach(function (type) {
		controls.addEventListener(type, function (event) {
			event.preventDefault();
			event.stopPropagation();
		}, { passive: false });
	});

	function releaseAll() {
		Array.from(activePointers.keys()).forEach(release);
	}

	window.addEventListener('blur', releaseAll);
	document.addEventListener('visibilitychange', function () {
		if (document.hidden) releaseAll();
	});
})();
</script>

<script>
(function () {
	var hud = document.getElementById('lives-hud');
	var MAX_SLOTS = 8;      // máximo de corazones dibujados; por encima se muestra "♥ xN"
	var MIN_SLOTS = 3;      // siempre se ven al menos 3 huecos
	var lastLives = null;
	var peak = MIN_SLOTS;
	var flashTimer = null;

	// ── Corazón pixel-art 7x7 (X = relleno) ──
	var SHAPE = [
		'.XX.XX.',
		'XXXXXXX',
		'XXXXXXX',
		'XXXXXXX',
		'.XXXXX.',
		'..XXX..',
		'...X...'
	];
	var LIGHT = [[1,1],[1,2],[2,1]];            // brillo arriba-izquierda
	var DARK  = [[2,5],[3,5],[3,4],[4,4],[5,4]]; // sombra abajo-derecha

	function has(r, c) {
		return r >= 0 && r < 7 && c >= 0 && c < 7 && SHAPE[r].charAt(c) === 'X';
	}
	function inList(list, r, c) {
		for (var i = 0; i < list.length; i++) if (list[i][0] === r && list[i][1] === c) return true;
		return false;
	}
	function rect(r, c, fill) {
		return '<rect x="' + (c + 1) + '" y="' + (r + 1) + '" width="1" height="1" fill="' + fill + '"/>';
	}
	function buildHeart(full, scheme) {
		var pal = full
			? (scheme === 'mido' ? { body: '#b36bff', light: '#e6ccff', dark: '#6a2fc2', line: '#1a0733' } : { body: '#ff4d63', light: '#ffc1cb', dark: '#c21f3a', line: '#2a0710' })
			: { body: '#4a3848', light: '#4a3848', dark: '#3a2a38', line: 'rgba(255,255,255,.28)' };
		var out = '<svg viewBox="0 0 9 9" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
		// contorno (vecinos en 8 direcciones)
		for (var r = -1; r <= 7; r++) {
			for (var c = -1; c <= 7; c++) {
				if (has(r, c)) continue;
				var near = false;
				for (var dr = -1; dr <= 1 && !near; dr++)
					for (var dc = -1; dc <= 1; dc++)
						if (has(r + dr, c + dc)) { near = true; break; }
				if (near) out += rect(r, c, pal.line);
			}
		}
		// relleno
		for (var r2 = 0; r2 < 7; r2++) {
			for (var c2 = 0; c2 < 7; c2++) {
				if (!has(r2, c2)) continue;
				var col = pal.body;
				if (inList(LIGHT, r2, c2)) col = pal.light;
				else if (inList(DARK, r2, c2)) col = pal.dark;
				out += rect(r2, c2, col);
			}
		}
		return out + '</svg>';
	}
	var ICONS = {
		'3': ['........','........','...##...','..#wY#..','.#wYYY#.','#wYYYYY#','########','........'],
		'4': ['...##...','..#wi#..','..#wi#..','..#wi#..','..#wi#..','.#YYYY#.','..#WW#..','..#bb#..'],
		'5': ['........','.######.','#iiYYjj#','#iiYYjj#','#YYYYYY#','#iiYYjj#','.#iYYj#.','...##...'],
		'7': ['........','........','...##...','..#wB#..','.#wBBB#.','#wBBBBB#','########','........']
	};
	var ICON_COL = { '#': '#2a0710', w: '#fff4dc', Y: '#ffcc33', i: '#bfe8ff', j: '#5aa9d6', W: '#c98a52', b: '#8a4a24', B: '#4aa3ff' };
	function buildIcon(id) {
		var rows = ICONS[id], out = '<svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
		for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
			var ch = rows[y].charAt(x);
			if (ch !== '.') out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + ICON_COL[ch] + '"/>';
		}
		return out + '</svg>';
	}
	var ICON_HTML = { '3': buildIcon('3'), '4': buildIcon('4'), '5': buildIcon('5'), '7': buildIcon('7') };
	var ITEM_IDS = ['3', '4', '5', '7'];
	var invState = {};
	var invKey = '';
	var lastInv = null;
	function readInv() {
		var o = {};
		try {
			var inv = window.player && window.player().inventory;
			if (inv) ITEM_IDS.forEach(function (id) { if (inv[id] > 0) o[id] = true; });
		} catch (e) {}
		return o;
	}
	function itemsHtml(prev) {
		var h = '';
		ITEM_IDS.forEach(function (id) {
			if (!invState[id]) return;
			var isNew = prev && !prev[id];
			h += '<span class="itm' + (isNew ? ' gain' : '') + '">' + ICON_HTML[id] + '</span>';
		});
		return h ? '<span class="sep"></span>' + h : '';
	}
	var HEART_FULL = buildHeart(true);
	var MIDO_FULL = buildHeart(true, 'mido');
	var HEART_EMPTY = buildHeart(false);

	function readLives() {
		try {
			var si = window.scriptInterpreter;
			if (si && si.HasVariable('LinkHP')) {
				var v = parseInt(si.GetVariable('LinkHP'), 10);
				return isNaN(v) ? null : v;
			}
		} catch (e) {}
		return null;
	}

	function render(n, prev) {
		var shown = Math.max(0, n);
		var html = '';
		if (shown > MAX_SLOTS) {
			html = '<span class="heart ' + (prev !== null && n > prev ? 'gain' : (prev !== null && n < prev ? 'lose' : '')) + '">' + HEART_FULL + '</span>'
				+ '<span class="count">x' + shown + '</span>';
		} else {
			peak = Math.min(MAX_SLOTS, Math.max(peak, shown));
			var prevShown = prev === null ? shown : Math.max(0, prev);
			for (var i = 0; i < peak; i++) {
				var cls = 'heart';
				if (prev !== null && i >= prevShown && i < shown) cls += ' gain';
				if (prev !== null && i >= shown && i < prevShown) cls += ' lose';
				html += '<span class="' + cls + '">' + (i < shown ? HEART_FULL : HEART_EMPTY) + '</span>';
			}
		}
		hud.innerHTML = html + itemsHtml(lastInv);
		lastInv = invState;
		hud.setAttribute('aria-label', 'Vidas: ' + shown);
		hud.classList.toggle('dead', n <= 0);
	}

	function flash(kind) {
		hud.classList.remove('flash-loss', 'flash-gain');
		hud.classList.add(kind);
		clearTimeout(flashTimer);
		flashTimer = setTimeout(function () { hud.classList.remove('flash-loss', 'flash-gain'); }, 700);
	}


	// ── Vida de Mido (contrincante, arriba a la derecha) ──
	var midoHud = document.getElementById('mido-hud');
	var MIDO_FACE = ['..XXXX..', '.XXXXXX.', '.XTTTTX.', '.TBTTBT.', 'TUUuUUUT', '.UUBBUU.', '.UU..UU.', '.BB..BB.'];
	var MIDO_COL = { X: '#d6422a', T: '#f3c08f', B: '#7a4a24', U: '#3aa655', u: '#86e06e' };
	var MIDO_FACE_HTML = (function () {
		var o = '<svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
		for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
			var ch = MIDO_FACE[y].charAt(x);
			if (ch !== '.') o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + MIDO_COL[ch] + '"/>';
		}
		return o + '</svg>';
	})();
	var lastMido = null;
	function readVar(name) {
		try {
			var si = window.scriptInterpreter;
			if (si && si.HasVariable(name)) {
				var v = parseInt(si.GetVariable(name), 10);
				return isNaN(v) ? null : v;
			}
		} catch (e) {}
		return null;
	}
	function midoActive() {
		try {
			return readVar('MidoTalked') === 1 && window.sprite && window.sprite['c'] && window.sprite['c'].room != null;
		} catch (e) { return false; }
	}
	function renderMido(n, prev) {
		var shown = Math.max(0, n), html = '<span class="face">' + MIDO_FACE_HTML + '</span>';
		for (var i = 0; i < 3; i++) {
			var cls = 'heart';
			if (prev !== null && i >= shown && i < Math.max(0, prev)) cls += ' lose';
			html += '<span class="' + cls + '">' + (i < shown ? MIDO_FULL : HEART_EMPTY) + '</span>';
		}
		midoHud.innerHTML = html;
		midoHud.setAttribute('aria-label', 'Vida de Mido: ' + shown);
	}
	function tickMido() {
		if (holdHud()) return;
		var n = readVar('MidoHP');
		if (n === null || !midoActive() || window.isNarrating === true) {
			midoHud.style.display = 'none'; lastMido = null; return;
		}
		if (n !== lastMido) {
			renderMido(n, lastMido);
			if (lastMido !== null && n < lastMido) {
				midoHud.classList.add('flash-gain');
				setTimeout(function () { midoHud.classList.remove('flash-gain'); }, 700);
			}
			lastMido = n;
		}
		midoHud.style.display = 'flex';
		var canvas = document.getElementById('game');
		if (!canvas) return;
		var r = canvas.getBoundingClientRect(), W = r.width;
		midoHud.style.setProperty('--hs', Math.round(Math.max(12, W * 0.042)) + 'px');
		midoHud.style.left = 'auto';
		midoHud.style.right = Math.round((document.documentElement.clientWidth || window.innerWidth) - r.right + W * 0.02) + 'px';
		midoHud.style.top = Math.round(r.top + W * 0.01) + 'px';
	}
	setInterval(tickMido, 100);


	// Retiene los cambios de vida mientras el jugador está leyendo la respuesta de la pregunta
	// (el guion se adelanta a la pantalla, así que se sincroniza con la página visible).
	var holding = false;
	function pageText() {
		try {
			if (typeof dialogBuffer === 'undefined' || !dialogBuffer || !dialogBuffer.CurPage) return '';
			return dialogBuffer.CurPage().map(function (r) { return r.map(function (c) { return c.char || ''; }).join(''); }).join(' ');
		} catch (e) { return ''; }
	}
	function holdHud() {
		if (window.isDialogMode !== true) { holding = false; return false; }
		var t = pageText();
		if (t.indexOf('Tu respuesta ha sido') !== -1) { holding = true; return true; }
		if (holding && /PREGUNTA|sin vidas|Tu vida actual|vida de Mido|derrotado|huido|TRIFUERZA/.test(t)) holding = false;
		return holding;
	}

	function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

	// Siempre dentro del juego, arriba a la izquierda (a prueba de móvil vertical y horizontal).
	// Altura de la píldora ≈ 1.56·hs + borde, para no invadir el cuadro de diálogo superior.
	function layout() {
		var canvas = document.getElementById('game');
		if (!canvas) return;
		var r = canvas.getBoundingClientRect();
		var W = r.width;
		hud.style.setProperty('--hs', Math.round(Math.max(12, W * 0.042)) + 'px');
		hud.style.transform = 'none';
		hud.style.left = Math.round(r.left + W * 0.02) + 'px';
		hud.style.top = Math.round(r.top + W * 0.01) + 'px';
	}

	function tick() {
		if (holdHud()) return;
		var n = readLives();
		if (n === null) { hud.style.display = 'none'; return; }
		var inv = readInv(), key = ITEM_IDS.filter(function (i) { return inv[i]; }).join();
		if (key !== invKey) {
			lastInv = invState; invState = inv; invKey = key;
			render(n, n);
			if (lastLives !== null && key) flash('flash-gain');
		}
		if (n !== lastLives) {
			render(n, lastLives);
			if (lastLives !== null) flash(n < lastLives ? 'flash-loss' : 'flash-gain');
			lastLives = n;
		}
		// oculto en pantallas de título/final, donde el texto va centrado
		if (window.isNarrating === true) { hud.style.display = 'none'; return; }
		hud.style.display = 'flex';
		layout();
	}

	window.addEventListener('resize', layout);
	window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });
	setInterval(tick, 100);
})();
</script>


<script>
/* Botones pixel-art de la cruceta */
(function () {
	var N = 14;
	var C = { o:'#120a1e', L:'#ffe48a', g:'#e0a92e', d:'#8a5a16', f:'#3b2a63', h:'#5a438f', a:'#fff4dc', s:'#120a1e', k:'rgba(0,0,0,.45)' };
	var arrowUp = [[6,2],[7,2],[5,3],[6,3],[7,3],[8,3],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[6,6],[7,6],[6,7],[7,7],[6,8],[7,8],[6,9],[7,9],[6,10],[7,10]];
	var rot = {
		up: function (x, y) { return [x, y]; },
		right: function (x, y) { return [N - 1 - y, x]; },
		down: function (x, y) { return [N - 1 - x, N - 1 - y]; },
		left: function (x, y) { return [y, N - 1 - x]; }
	};
	function rect(x, y, c) { return '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>'; }
	function build(dir) {
		var out = '';
		// sombra proyectada
		for (var x = 1; x < N - 1; x++) out += rect(x, N, C.k) + rect(x, N - 1 + 0, 'none');
		out = '<g>' + out + '</g><g class="cap">';
		for (var y = 0; y < N; y++) {
			for (var x2 = 0; x2 < N; x2++) {
				var edgeX = (x2 === 0 || x2 === N - 1), edgeY = (y === 0 || y === N - 1);
				if (edgeX && edgeY) continue;
				var c;
				if (edgeX || edgeY) c = C.o;
				else if (x2 === 1 || y === 1) c = C.L;
				else if (x2 === N - 2 || y === N - 2) c = C.d;
				else if (x2 === 2 || y === 2) c = C.g;
				else if (x2 === N - 3 || y === N - 3) c = C.g;
				else c = (y === 3 || x2 === 3) ? C.h : C.f;
				out += rect(x2, y, c);
			}
		}
		var f = rot[dir];
		arrowUp.forEach(function (p) { var q = f(p[0], p[1]); out += rect(q[0], q[1], C.a); });
		return '<svg viewBox="0 0 ' + N + ' ' + (N + 1) + '" aria-hidden="true">' + out + '</g></svg>';
	}
	['up', 'left', 'right', 'down'].forEach(function (d) {
		var b = document.querySelector('#touch-controls .' + d);
		if (b) b.innerHTML = build(d);
	});
})();
</script>

	[tri, triL, triR].forEach(function (tl) {

		px.forEach(function (p) { for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) if (dx || dy) rect(svg, ox + p[0] + dx, oy + p[1] + dy, 1, 1, '#2a0508'); });

	function showGameOver(who) {
		if (busy) return; busy = true;
		var ov = document.createElement('div'); ov.className = 'pxo over';
		var logo = document.createElement('div'); logo.className = 'gologo'; logo.appendChild(overSVG());
		var sub = document.createElement('div'); sub.className = 'gosub'; sub.textContent = who === 2 ? 'Ganon te ha derrotado.' : (who === 1 ? 'Mido te ha derrotado.' : 'Te has quedado sin vidas.');
		var hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = 'PULSA PARA REINTENTAR';
		ov.appendChild(logo); ov.appendChild(sub); ov.appendChild(hint);
		document.body.appendChild(ov);
		requestAnimationFrame(function () { ov.classList.add('show'); });
		var armed = false; setTimeout(function () { armed = true; }, 900);
		function restart() { if (!armed) return; location.reload(); }
		lockInput(restart);
		ov.addEventListener('pointerdown', function (e) { e.preventDefault(); restart(); });
	}

	setInterval(function () {
		if (busy) return;
		var go = readVar('GameOver');
		if (go === 1 || go === 2) {
			// El guion va por delante de la pantalla: esperamos a que se vea la página
			// "¡Te has quedado sin vidas!" y a que el jugador pulse una vez más.
			if (!dying) {
				var t = pageText();
				if (t.indexOf('sin vidas') !== -1) {
					dying = true;
					setTimeout(function () {
						var offKey, offPtr;
						var fire = function () { offKey(); offPtr(); showGameOver(go); };
						offKey = lockInput(fire);
						offPtr = pointerArm(fire);
					}, 500);
				}
			}
			return;
		}
		if (window.isDialogMode) return;
		if (readVar('NoteMido') === 1) showNote();
	}, 150);
})();

<script>
/* Pantalla final: logo + fecha sobre fondo verde */
(function () {
	var fin = document.getElementById('finale'), started = false;
	function readVar(n) { try { var si = window.scriptInterpreter; if (si && si.HasVariable(n)) return parseInt(si.GetVariable(n), 10); } catch (e) {} return null; }
	for (var i = 0; i < 60; i++) {
		var sp = document.createElement('i'); sp.className = 'spark';
		sp.style.left = (Math.random() * 100) + '%'; sp.style.top = (45 + Math.random() * 55) + '%';
		sp.style.animationDelay = (Math.random() * 7).toFixed(2) + 's'; sp.style.animationDuration = (5 + Math.random() * 4).toFixed(1) + 's';
		if (Math.random() < .3) sp.style.width = sp.style.height = '9px';
		fin.appendChild(sp);
	}
	function start() {
		started = true; fin.style.display = 'flex';
		requestAnimationFrame(function () { requestAnimationFrame(function () { fin.classList.add('show'); }); });
	}
	var block = function (e) { if (!started) return; e.stopImmediatePropagation(); e.preventDefault(); };
	['keydown', 'keyup'].forEach(function (t) { window.addEventListener(t, block, true); });
	setInterval(function () { if (!started && !window.isDialogMode && readVar('GameWin') === 1) start(); }, 200);
})();
</script>
